# Static site → GitHub Pages. No build step: the app files are copied as they are.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # only what the site serves: not the tests, scripts or README
      - run: |
          mkdir _site
          cp index.html style.css app.js codec.js jpeg.js media.js _site/
          if [ -d boards ]; then cp -R boards _site/; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
